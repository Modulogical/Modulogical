<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modulogical — Settings</title>
<link rel="stylesheet" href="/assets/css/modulogical.css">
<link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon-180.png">
<style>
  .app-main{ padding: 40px 0 80px; }
  .settings-shell{ max-width: 640px; }
  .page-head{ margin-bottom: 30px; }

  .settings-section{ margin-bottom: 28px; }
  .settings-section-label{ margin-bottom: 10px; }
  .settings-section-label .h3{ margin-bottom: 3px; }

  .settings-row{
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    padding: 16px 0;
    border-top: 1px solid var(--line);
  }
  .settings-row:first-child{ border-top: none; }
  .settings-row-label{ flex-shrink: 0; width: 150px; padding-top: 9px; }
  .settings-row-label .name{ font-size: .88rem; font-weight: 560; color: var(--text-1); }
  .settings-row-label .note{ font-size: .78rem; color: var(--text-3); margin-top: 3px; }
  .settings-row-control{ flex: 1; min-width: 0; }

  .inline-notice{
    display: none;
    margin-top: 10px;
    padding: 9px 12px;
    border-radius: var(--radius-sm);
    font-size: .8rem;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--text-2);
  }
  .inline-notice.show{ display: block; }
  .inline-notice.is-pending{ border-color: rgba(224,179,85,.3); background: rgba(224,179,85,.08); color: #f0d9a8; }

  .danger-row{
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px;
    border: 1px solid rgba(239,111,111,.22);
    background: var(--danger-wash);
    border-radius: var(--radius-md);
  }
  .danger-row .name{ font-size: .88rem; font-weight: 560; color: var(--text-1); }
  .danger-row .note{ font-size: .78rem; color: var(--text-2); margin-top: 2px; }

  .theme-grid{
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }
  .theme-option{
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
    padding: 10px;
    text-align: left;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--surface-1);
    cursor: pointer;
    transition: border-color var(--fast) var(--ease),
                background var(--fast) var(--ease),
                transform var(--fast) var(--ease);
  }
  .theme-option:hover{
    border-color: var(--line-strong);
    background: var(--surface-2);
  }
  .theme-option:active{ transform: scale(.99); }
  .theme-option.is-selected{
    border-color: var(--accent-line);
    background: var(--accent-wash);
  }
  /* Each card is a tiny, self-contained version of the real chat UI.
     Its custom properties are populated directly from modulogical.css by JS. */
  .theme-preview{
    display: block;
    height: 142px;
    overflow: hidden;
    position: relative;
    border: 1px solid var(--line-strong);
    border-radius: 9px;
    background: var(--dashboard-bg, var(--bg));
    color: var(--text-chat, var(--text-1));
    font-family: var(--font);
  }

  .theme-preview-app{
    display: flex;
    width: 100%;
    height: 100%;
    background:
      radial-gradient(circle at 18% 15%, var(--left-glow-primary, transparent), transparent 42%),
      radial-gradient(circle at 82% 82%, var(--right-glow-primary, transparent), transparent 45%),
      var(--dashboard-bg, var(--bg));
  }

  .theme-preview-sidebar{
    flex: 0 0 25%;
    min-width: 0;
    padding: 8px 6px;
    border-right: 1px solid var(--line);
    background: var(--surface-1);
  }

  .theme-preview-logo{
    height: 7px;
    width: 58%;
    margin: 1px 3px 10px;
    border-radius: 3px;
    background: var(--accent-gradient, var(--accent));
    opacity: .9;
  }

  .theme-preview-nav{
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .theme-preview-nav span{
    display: block;
    height: 5px;
    width: 76%;
    border-radius: 3px;
    background: var(--text-3);
    opacity: .75;
  }

  .theme-preview-nav span:first-child{
    width: 88%;
    background: var(--accent);
  }

  .theme-preview-chat{
    min-width: 0;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 8px;
  }

  .theme-preview-chatbar{
    height: 7px;
    width: 38%;
    margin: 1px 0 9px;
    border-radius: 3px;
    background: var(--text-2);
    opacity: .8;
  }

  .theme-preview-message{
    align-self: flex-start;
    max-width: 72%;
    padding: 7px 8px;
    border: 1px solid var(--line);
    border-radius: 7px 7px 7px 2px;
    background: var(--surface-2);
    color: var(--text-chat, var(--text-1));
    font-family: var(--font);
    font-size: 7px;
    line-height: 1.25;
    white-space: nowrap;
    box-shadow: 0 3px 12px rgba(0,0,0,.12);
  }

  .theme-preview-input{
    margin-top: auto;
    height: 18px;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 3px 4px 3px 6px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface-1);
  }

  .theme-preview-input-text{
    min-width: 0;
    flex: 1;
    color: var(--text-3);
    font-size: 6px;
    white-space: nowrap;
  }

  .theme-preview-send{
    flex: 0 0 auto;
    height: 12px;
    padding: 0 6px;
    border: 0;
    border-radius: 4px;
    background: var(--button-primary-bg, var(--accent));
    color: var(--button-primary-text, var(--text-inverse));
    font: 700 5px var(--font);
  }
  .theme-option-copy{ display: flex; flex-direction: column; gap: 2px; padding: 0 2px 2px; }
  .theme-option-copy .name{ font-size: .88rem; font-weight: 560; color: var(--text-1); }
  .theme-option-copy .note{ font-size: .76rem; color: var(--text-3); }
  .theme-check{
    position: absolute;
    top: 17px;
    right: 17px;
    width: 20px;
    height: 20px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--accent);
    color: var(--text-inverse);
    font-size: .7rem;
    font-weight: 800;
    opacity: 0;
    transform: scale(.8);
    transition: opacity var(--fast) var(--ease), transform var(--fast) var(--ease);
  }
  .theme-option.is-selected .theme-check{
    opacity: 1;
    transform: scale(1);
  }

  @media (max-width: 620px){
    .theme-grid{ grid-template-columns: 1fr; }
    .settings-row{ flex-direction: column; gap: 8px; }
    .settings-row-label{ width: auto; padding-top: 0; }
  }
</style>
</head>

<main class="app-main" id="main">
  <div class="shell settings-shell">
    <div class="page-head fade-up">
      <h1 class="h1">Settings</h1>
      <p class="small">Manage your account and session.</p>
    </div>

    <!-- Account -->
    <section class="settings-section fade-up">
      <div class="settings-section-label">

      </div>
      <div class="panel panel-tight">
        <div class="settings-row">
          <div class="settings-row-label">

    <!-- Security -->

    <!-- Appearance -->

    <!-- Session -->

<script src="/assets/js/modulogical.js"></script>
<script>
  (async function init(){
    await Modulogical.requireAuth();
    Modulogical.initNav("settings");
    await Modulogical.loadTheme();

    await renderThemeOptions();
    renderSelectedTheme(Modulogical.getTheme());

    const displayName = localStorage.getItem(Modulogical.NAME_KEY) || localStorage.getItem(Modulogical.USERNAME_KEY) || "Account";
    document.getElementById("nav-name").textContent = displayName;
    document.getElementById("nav-avatar").textContent = Modulogical.initials(displayName);

    const usernameInput = document.getElementById("changeusername");
    if (usernameInput) usernameInput.placeholder = localStorage.getItem(Modulogical.USERNAME_KEY)
      ? "Currently: " + localStorage.getItem(Modulogical.USERNAME_KEY)
      : "New username";
  })();

  function formatThemeName(key){
    if (key === "holographic") return "Holographic dark";
    return key
      .replace(/[-_]+/g, " ")
      .replace(/\b\w/g, char => char.toUpperCase());
  }

  function getThemeNote(key){
    if (key === "holographic") return "The default Modulogical interface";
    if (key === "greyscale") return "Black, grey and white only";
    return "Modulogical theme";
  }

  let themeRootVariables = new Map();
  let themeVariables = new Map();

  function parseThemeVariables(css){
    const cleanCss = css.replace(/\/\*[\s\S]*?\*\//g, "");
    const rootVariables = new Map();
    const themedVariables = new Map();

    const blockRegex = /(:root|\[data-theme\s*=\s*["']([^"']+)["']\])\s*\{([^{}]*)\}/g;
    let match;

    while ((match = blockRegex.exec(cleanCss)) !== null) {
      const selector = match[1];
      const key = match[2];
      const body = match[3];
      const variables = new Map();
      const variableRegex = /(--[a-zA-Z0-9_-]+)\s*:\s*([^;]+)\s*;/g;
      let variableMatch;

      while ((variableMatch = variableRegex.exec(body)) !== null) {
        variables.set(variableMatch[1], variableMatch[2].trim());
      }

      if (selector === ":root") {
        for (const [property, value] of variables) {
          rootVariables.set(property, value);
        }
      } else if (key) {
        themedVariables.set(key.trim(), variables);
      }
    }

    themeRootVariables = rootVariables;
    themeVariables = themedVariables;
  }

  async function discoverThemes(){
    const themes = [
      {
        key: "holographic",
        label: "Holographic dark",
        note: "The default Modulogical interface"
      }
    ];

    try {
      const response = await fetch("/assets/css/modulogical.css", { cache: "no-store" });
      if (!response.ok) throw new Error("Could not load theme stylesheet.");

      const css = await response.text();
      parseThemeVariables(css);

      const cssWithoutComments = css.replace(/\/\*[\s\S]*?\*\//g, "");
      const regex = /\[data-theme\s*=\s*["']([^"']+)["']\]/g;
      const seen = new Set(themes.map(theme => theme.key.toLowerCase()));

      let match;
      while ((match = regex.exec(cssWithoutComments)) !== null) {
        const key = match[1].trim();
        if (!key || !/^[a-zA-Z0-9_-]+$/.test(key)) continue;

        // The stylesheet contains a legacy selector named "Holographic Dark"
        // whose values are the same default values as :root. Treat it as
        // the built-in holographic theme rather than rendering a duplicate.
        if (key.toLowerCase() === "holographic dark") continue;

        const normalizedKey = key.toLowerCase();
        if (seen.has(normalizedKey)) continue;

        seen.add(normalizedKey);
        themes.push({
          key,
          label: formatThemeName(key),
          note: getThemeNote(key)
        });
      }
    } catch (error) {
      console.error("Theme discovery failed:", error);
    }

    return themes;
  }

  function createThemeOption(theme){
    const option = document.createElement("button");
    option.type = "button";
    option.className = "theme-option";
    option.dataset.themeOption = theme.key;
    option.setAttribute("aria-pressed", "false");

    option.innerHTML = `
      <span class="theme-preview" aria-hidden="true">
        <span class="theme-preview-app">
          <span class="theme-preview-sidebar">
            <span class="theme-preview-logo"></span>
            <span class="theme-preview-nav">
              <span></span><span></span><span></span><span></span>
            </span>
          </span>
          <span class="theme-preview-chat">
            <span class="theme-preview-chatbar"></span>
            <span class="theme-preview-message">Hello, Atlas</span>
            <span class="theme-preview-input">
              <span class="theme-preview-input-text">Message Atlas...</span>
              <span class="theme-preview-send">Send</span>
            </span>
          </span>
        </span>
      </span>
      <span class="theme-option-copy">
        <span class="name">${escapeHtml(theme.label)}</span>
        <span class="note">${escapeHtml(theme.note)}</span>
      </span>
      <span class="theme-check" aria-hidden="true">✓</span>
    `;

    const preview = option.querySelector(".theme-preview");
    applyThemeVariablesToPreview(preview, theme.key);

    option.addEventListener("click", async () => {
      const selectedTheme = option.dataset.themeOption;
      const token = Modulogical.getToken();

      if (!Modulogical.themeByKey(selectedTheme)) return;

      if (!token) {
        showThemeNotice("You are not logged in.", "error");
        return;
      }

      const previousTheme = Modulogical.getTheme();
      Modulogical.applyTheme(selectedTheme);
      renderSelectedTheme(selectedTheme);

      try {
        const response = await fetch(Modulogical.API + "/settings/theme", {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ theme: selectedTheme, token })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || "Could not save theme.");
        }

        showThemeNotice("Theme saved.", "success");
      } catch (error) {
        console.error("Theme change failed:", error);
        Modulogical.applyTheme(previousTheme);
        renderSelectedTheme(previousTheme);
        showThemeNotice("Could not save theme. Your previous theme has been restored.", "error");
      }
    });

    return option;
  }

  function applyThemeVariablesToPreview(preview, themeKey){
    if (!preview) return;

    // Start with :root so the default Holographic Dark appearance is always
    // resolved from the stylesheet itself, not from the theme currently
    // applied to <html>.
    const variables = new Map(themeRootVariables);
    const overrides = themeVariables.get(themeKey);

    if (overrides) {
      for (const [property, value] of overrides) {
        variables.set(property, value);
      }
    }

    // Copy the complete token set from :root + this theme onto the preview.
    // The preview therefore renders from the same CSS design tokens as the
    // actual interface, including gradients where those tokens are available.
    for (const [property, value] of variables) {
      preview.style.setProperty(property, value);
    }

    // A few preview-only fallbacks make the miniature UI work with both the
    // current semantic tokens and older theme definitions.
    const fallbackTokens = {
      "--dashboard-bg": "var(--bg)",
      "--text-chat": "var(--text-1)",
      "--button-primary-bg": "var(--accent)",
      "--button-primary-text": "var(--text-inverse)"
    };

    for (const [property, value] of Object.entries(fallbackTokens)) {
      if (!preview.style.getPropertyValue(property)) {
        preview.style.setProperty(property, value);
      }
    }
  }

  function escapeHtml(value){
    return String(value).replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);
  }

  async function renderThemeOptions(){
    const container = document.getElementById("theme-options");
    if (!container) return;

    container.replaceChildren();

    const themes = await discoverThemes();

    themes.forEach(theme => {
      container.appendChild(createThemeOption(theme));
    });
  }

  function renderSelectedTheme(theme){
    document.querySelectorAll("[data-theme-option]").forEach(option => {
      const selected = option.dataset.themeOption === theme;
      option.classList.toggle("is-selected", selected);
      option.setAttribute("aria-pressed", selected ? "true" : "false");
    });
  }

  function showThemeNotice(message, kind){
    const el = document.getElementById("theme-notice");
    if (!el) return;
    el.textContent = message;
    el.className = "inline-notice show" + (kind ? " is-" + kind : "");
    if (kind === "success") {
      setTimeout(() => { el.className = "inline-notice"; }, 2200);
    }
  }

  const Settings = (() => {
    function showNotice(id, message, kind){
      const el = document.getElementById(id);
      el.textContent = message;
      el.className = "inline-notice show" + (kind ? " is-" + kind : "");
    }
    async function changeUsername() {
  const value = document.getElementById("changeusername").value.trim();
  const old_username = localStorage.getItem("atlas_username");
  if (!value) {
    showNotice(
      "username-notice",
      "Enter a new username first.",
      "pending"
    );
    return;
  }
  const token = localStorage.getItem("atlas_token");
  if (!token) {
    showNotice(
      "username-notice",
      "You are not logged in.",
      "error"
    );
    return;
  }
  try {
    const response = await fetch(Modulogical.API + "/settings/ChangeUsername", {
      method: "PATCH",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        username: value,
        token: token,
        old_username: old_username
      })
    });
    const data = await response.json();
    if (!response.ok) {
      showNotice(
        "username-notice",
        data["Username-notice"] || "Could not change username.",
        data["status"]
      );
      return;
    }
    showNotice(
      "username-notice",
      data["Username-notice"] || "Username changed successfully!",
      data["status"]
    );
    localStorage.setItem('atlas_username' , value)
    document.getElementById("changeusername").value = "";
  } catch (error) {
    console.error("Username change failed:", error);
    showNotice(
      "username-notice",
      "Could not connect to the server.",
      "error"
    );
  }
}

    async function changePassword(){
      const pw = document.getElementById("changepassword").value;
      const confirm = document.getElementById("confirmpassword").value;
      if (!pw || pw.length < 8) { showNotice("password-notice", "Password must be at least 8 characters.", "pending"); return; }
      if (pw !== confirm) { showNotice("password-notice", "Passwords don't match.", "pending"); return; }
      const username = localStorage.getItem("atlas_username");
      const token = localStorage.getItem("atlas_token");
      if (!pw) {
      showNotice(
      "password-notice",
      "Required fields must be full",
      "pending"
       );
       return;
       }
      
       if (!confirm) {
        showNotice(
          "password-notice",
          "Required fields must be full",
          "pending"
        );
        return;
       }
       try { 
        const response = await fetch(Modulogical.API + "/settings/ChangePassword", {
      method: "PATCH",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        username: username,
        token: token,
        pw: pw,
        confirm: confirm
      })
    });
    const data = await response.json();
    if (!response.ok) {
      showNotice(
        "password-notice",
        data["password-notice"] || "Could not change password.",
        data["status"]
      );
      return;
    }
    showNotice(
      "password-notice",
      data["password-notice"] || "Password changed successfully!",
      data["status"]
    );
  } catch (error) {
    console.error("Password change failed:", error);
    showNotice(
      "password-notice",
      "Could not connect to the server.",
      "error"
    );
       }
    }

    return { changeUsername, changePassword };
  })();
</script>
