<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modulogical — Engine Forge</title>
<link rel="stylesheet" href="/assets/css/modulogical.css">
<link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon-180.png">
<style>
.app-main{padding:40px 0 80px}.page-head{margin-bottom:28px;max-width:760px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:24px}.search{flex:1;min-width:220px}.category-row{display:flex;gap:7px;flex-wrap:wrap}.category-btn{padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface-1);color:var(--text-2);font-size:.78rem;cursor:pointer}.category-btn:hover,.category-btn.active{background:var(--surface-2);color:var(--text-1);border-color:var(--line-strong)}.forge-panel{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--radius-lg);padding:28px;margin-bottom:30px}.forge-type-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.forge-type-card{min-height:190px;display:flex;flex-direction:column;padding:20px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface-2)}.forge-type-title{font-size:1rem;font-weight:600;color:var(--text-1)}.forge-type-description{flex:1;min-height:70px;margin-top:10px;color:var(--text-2)}.forge-type-button{align-self:flex-start;margin-top:18px;text-decoration:none}@media(max-width:760px){input:not([type="range"]),textarea,select{font-size:16px!important}.forge-type-grid{grid-template-columns:1fr}.forge-panel{padding:18px}.forge-type-button{width:100%;box-sizing:border-box;text-align:center}}.forge-grid{grid-template-columns:1fr}.flow-canvas{height:520px}.forge-panel{padding:18px}.forge-actions{flex-direction:column;align-items:stretch}.forge-actions .btn{width:100%}.flow-toolbar{display:grid;grid-template-columns:1fr 1fr}.flow-toolbar button:last-child{grid-column:1 / -1}}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="appnav" aria-label="Mobile navigation">
  <div class="shell appnav-row">
    <a class="brand" href="/chat"><span class="brand-mark" aria-hidden="true"></span>MODULOGICAL</a>
    <button class="nav-toggle topbar-button" data-nav-toggle aria-label="Open navigation" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <nav class="appnav-links" data-nav-drawer aria-label="Main navigation"></nav>
  </div>
</header>
<aside class="shared-sidebar" data-shared-sidebar aria-label="Main navigation"></aside>

<div class="shared-app-main" data-page-root><main class="app-main" id="main"><div class="shell">
<div class="page-head fade-up"><h1 class="h1">Engine Forge</h1><p class="lede">Build, test, and submit your own Modulogical items for review.</p></div>
<div class="toolbar fade-up"><input class="input search" id="search" type="search" placeholder="Search Engine Forge..." aria-label="Search Engine Forge">
<div class="category-row"><button class="category-btn active" data-type="module">Modules</button><button class="category-btn" data-type="personality">Personalities</button><button class="category-btn" data-type="workflow">Workflows</button><button class="category-btn" data-type="webvector">WebVector</button></div></div>

<div class="section-label">Create item</div>
<section class="forge-panel fade-up"><div class="forge-type-grid">
<article class="forge-type-card"><div class="forge-type-title">Module</div><div class="forge-type-description"></div><a class="btn btn-primary forge-type-button" href="/engine-forge/module">Create</a></article>
<article class="forge-type-card"><div class="forge-type-title">Personality</div><div class="forge-type-description"></div><a class="btn btn-primary forge-type-button" href="/engine-forge/personality">Create</a></article>
<article class="forge-type-card"><div class="forge-type-title">Workflow</div><div class="forge-type-description"></div><a class="btn btn-primary forge-type-button" href="/engine-forge/workflow">Create</a></article>
<article class="forge-type-card"><div class="forge-type-title">WebVector</div><div class="forge-type-description"></div><a class="btn btn-primary forge-type-button" href="/engine-forge/webvector">Create</a></article>
<article class="forge-type-card"><div class="forge-type-title">Theme</div><div class="forge-type-description"></div><a class="btn btn-primary forge-type-button" href="/engine-forge/theme">Create</a></article>
<article class="forge-type-card"><div class="forge-type-title">Module Pack</div><div class="forge-type-description"></div><a class="btn btn-primary forge-type-button" href="/engine-forge/module-pack">Create</a></article>
</div></section>
</div></main></div>

<script src="/assets/js/modulogical.js"></script>
</body>
</html>
