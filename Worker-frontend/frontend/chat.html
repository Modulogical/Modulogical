<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modulogical — Chat</title>
<link rel="stylesheet" href="/assets/css/modulogical.css">
<link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon-180.png">
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  html, body{ height: 100%; overflow: hidden; }
  .workspace{
    min-height: 100vh;
  }

  /* ---- shared sidebar ------------------------------------------------ */
  /* mobile top bar + drawer */
  .mobile-topbar{ display: none; }
  .sidebar-scrim{ display: none; }

  /* ---- main column ------------------------------------------------ */
  .chat-main{
    margin-left: 0;
    display: flex;
    flex-direction: column;
    min-width: 0;
    height: 100vh;
  }

  .thread-scroll{
    flex: 1;
    overflow-y: auto;
    padding: 28px 0 12px;
  }
  .thread-inner{ max-width: 760px; margin: 0 auto; padding: 0 28px; }

  .thread-empty{
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 8px;
    padding: 40px 20px;
  }
  .thread-empty .h2{ margin-bottom: 4px; }

  .msg{ display: flex; margin-bottom: 22px; animation: fade-up var(--med) var(--ease) both; }
  .msg-user{ justify-content: flex-end; }
  .msg-bubble{ max-width: 78%; }
  .msg-user .msg-bubble{
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 14px 14px 3px 14px;
    padding: 11px 15px;
    font-size: .92rem;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .msg-assistant{ justify-content: flex-start; }
  .msg-assistant .msg-bubble{ max-width: 100%; }
  .msg-meta{
    display: flex; align-items: center; gap: 7px;
    margin-bottom: 6px;
    font-size: .78rem; color: var(--text-3);
  }
  .msg-meta .mark{
    width: 15px; height: 15px; border-radius: 4px;
    background: var(--accent-gradient);
    background-size: var(--accent-gradient-size) 100%;
    border: 1px solid var(--line-strong);
    position: relative; flex-shrink: 0;
    animation: holo-shift 13s ease-in-out infinite alternate;
  }
  .msg-text{
    font-size: .93rem;
    line-height: 1.65;
    color: var(--text-1);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  /* ---- rendered Markdown --------------------------------------------- */
  .msg-text.markdown-body{
    white-space: normal;
  }
  .msg-text.markdown-body p{
    margin: 0 0 .75em;
  }
  .msg-text.markdown-body p:last-child{
    margin-bottom: 0;
  }
  .msg-text.markdown-body h1,
  .msg-text.markdown-body h2,
  .msg-text.markdown-body h3,
  .msg-text.markdown-body h4,
  .msg-text.markdown-body h5,
  .msg-text.markdown-body h6{
    margin: 1em 0 .5em;
    line-height: 1.3;
  }
  .msg-text.markdown-body h1:first-child,
  .msg-text.markdown-body h2:first-child,
  .msg-text.markdown-body h3:first-child{
    margin-top: 0;
  }
  .msg-text.markdown-body ul,
  .msg-text.markdown-body ol{
    margin: .5em 0 .75em;
    padding-left: 1.5em;
  }
  .msg-text.markdown-body li{
    margin: .2em 0;
  }
  .msg-text.markdown-body blockquote{
    margin: .75em 0;
    padding-left: 1em;
    border-left: 3px solid var(--accent-line);
    color: var(--text-2);
  }
  .msg-text.markdown-body code{
    font-family: Consolas, "Courier New", monospace;
    font-size: .9em;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: .12em .35em;
  }
  .msg-text.markdown-body pre{
    margin: .75em 0;
    padding: 12px 14px;
    overflow-x: auto;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .msg-text.markdown-body pre code{
    background: transparent;
    border: none;
    padding: 0;
    white-space: pre;
  }
  .msg-text.markdown-body a{
    color: var(--accent);
    text-decoration: underline;
  }
  .msg-text.markdown-body hr{
    border: 0;
    border-top: 1px solid var(--line);
    margin: 1em 0;
  }
  .msg-text.markdown-body table{
    width: 100%;
    border-collapse: collapse;
    margin: .75em 0;
    overflow-x: auto;
  }
  .msg-text.markdown-body th,
  .msg-text.markdown-body td{
    border: 1px solid var(--line);
    padding: 7px 9px;
    text-align: left;
  }
  .msg-text.markdown-body th{
    background: var(--surface-2);
  }

  .msg-text .caret{
    display: inline-block;
    width: 7px; height: 1em;
    background: var(--accent);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink{ 50%{ opacity: 0; } }

  /* ---- composer ----------------------------------------------------- */
  .composer-wrap{
    border-top: 1px solid var(--line);
    background: linear-gradient(to top, var(--bg) 60%, transparent);
    padding: 14px 0 20px;
  }
  .composer{
    max-width: 760px;
    margin: 0 auto;
    padding: 0 28px;
  }
  .composer-box{
    background: var(--surface-1);
    backdrop-filter: blur(var(--blur-glass)) saturate(140%);
    -webkit-backdrop-filter: blur(var(--blur-glass)) saturate(140%);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 10px 10px 8px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
    transition: border-color var(--fast) var(--ease), box-shadow var(--fast) var(--ease);
  }
  .composer-box.is-focused{
    border-color: var(--accent-line);
    box-shadow: 0 0 0 3px var(--accent-wash);
  }
  #message{
    width: 100%;
    background: transparent;
    border: none;
    resize: none;
    color: var(--text-1);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.5;
    padding: 6px 8px 10px;
    max-height: 200px;
    min-height: 24px;
  }
  #message:focus{ outline: none; }
  #message::placeholder{ color: var(--text-3); }

  .composer-toolbar{
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 4px;
  }
  .composer-spacer{ flex: 1; }

  .control-pill{
    display: flex; align-items: center; gap: 7px;
    height: 32px; padding: 0 11px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--button-chat-preference-bg);
    font-size: .78rem;
    color: var(--button-chat-preference-text);
    cursor: pointer;
    position: relative;
    transition: border-color var(--fast) var(--ease), background var(--fast) var(--ease);
  }
  .control-pill:hover{ border-color: var(--button-chat-preference-hover-border); background: var(--button-chat-preference-hover); }
  .control-pill svg{ width: 12px; height: 12px; color: var(--text-3); }
  .control-pill .dot{ width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

  .send-btn{
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--button-chat-bg);
    background-size: auto;
    background-position: 0% 50%;
    color: var(--button-chat-text);
    border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: transform var(--fast) var(--ease), opacity var(--fast) var(--ease), box-shadow var(--fast) var(--ease);
    flex-shrink: 0;
    animation: holo-shift 8s ease-in-out infinite alternate;
  }
  .send-btn:hover:not(:disabled){ box-shadow: 0 4px 18px var(--button-chat-hover); transform: translateY(-1px); }
  .send-btn:active:not(:disabled){ transform: scale(.94); }
  .send-btn:disabled{ opacity: .35; cursor: not-allowed; }
  .send-btn svg{ width: 15px; height: 15px; }

  .composer-hint{ text-align: center; margin-top: 9px; }

  /* ---- popovers: model + temperature ------------------------------- */
  .popover{
    position: absolute;
    bottom: calc(100% + 8px);
    left: 0;
    width: 260px;
    background: var(--surface-2);
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-md);
    padding: 6px;
    box-shadow: 0 16px 40px rgba(0,0,0,.45);
    display: none;
    z-index: 30;
  }
  .popover.open{ display: block; animation: fade-up 160ms var(--ease) both; }
  .model-option{
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px;
    border-radius: 7px;
    cursor: pointer;
    transition: background var(--fast) var(--ease);
  }
  .model-option:hover{ background: var(--surface-3); }
  .model-option.selected{ background: var(--accent-wash); }
  .model-option .dot{ width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); flex-shrink: 0; }
  .model-option.selected .dot{ background: var(--accent); }
  .model-option .name{ font-size: .84rem; font-weight: 560; color: var(--text-1); }
  .model-option .desc{ font-size: .74rem; color: var(--text-2); }

  .temp-popover{ width: 220px; padding: 14px 14px 10px; }
  .temp-popover-row{ display: flex; justify-content: space-between; font-size: .78rem; color: var(--text-2); margin-bottom: 8px; }
  .temp-popover-row b{ color: var(--text-1); }
  input[type="range"]{
    -webkit-appearance: none;
    width: 100%; height: 4px;
    border-radius: 2px;
    background: var(--surface-3);
    margin: 6px 0 4px;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent-gradient);
    background-size: var(--accent-gradient-size) 100%;
    cursor: pointer;
    border: 2px solid #0a0c16;
  }
  input[type="range"]::-moz-range-thumb{
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent-gradient);
    background-size: var(--accent-gradient-size) 100%;
    border: 2px solid #0a0c16; cursor: pointer;
  }
  .temp-scale{ display: flex; justify-content: space-between; font-size: .68rem; color: var(--text-3); }

  @media (max-width: 760px){
    .workspace{ min-height: 100vh; }
    .chat-main{ margin-left: 0; }
    .shared-sidebar.open{ top:66px; }
.sidebar-scrim{
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.28);
      z-index: 70;
    }
    .sidebar-scrim.show{ display: block; }
    .mobile-topbar{
      position: relative;
      z-index: 90;
      display: flex; align-items: center; gap: 10px;
      height: 54px; padding: 0 14px;
      border-bottom: 1px solid var(--line);
      background: var(--bg);
      flex-shrink: 0;
    }
    .mobile-topbar button{
      width: 34px; height: 34px; border-radius: var(--radius-sm);
      border: 1px solid var(--button-topbar-border);
      background: var(--button-topbar-bg);
      color: var(--button-topbar-text);
      display: flex; align-items: center; justify-content: center;
    }
    .mobile-topbar button:hover{
      background: var(--button-topbar-hover);
      color: var(--button-topbar-hover-text);
      border-color: var(--button-topbar-hover-border);
    }
    .mobile-topbar button svg{ width: 16px; height: 16px; }
    .thread-inner{ padding: 0 16px; }
    .composer{ padding: 0 14px; }
    .msg-bubble{ max-width: 88%; }
  }

  @media (max-width: 430px){
    .thread-inner{ padding: 0 12px; }
    .composer{ padding: 0 10px; }
    .composer-box{ border-radius: var(--radius-md); }
    .msg-bubble{ max-width: 92%; }
    .control-pill{ padding-left: 10px; padding-right: 10px; }
  }
  .msg-text .caret{
    display: inline-block;
    width: 7px; height: 1em;
    background: var(--accent);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 1s step-end infinite;
  }
</style>
</head>
<body>
<div class="workspace">
  <div class="sidebar-scrim" data-scrim></div>

   <aside class="sidebar shared-sidebar" data-shared-sidebar data-nav-drawer aria-label="Main navigation"></aside>

  <div class="shared-app-main" data-page-root>
    <div class="chat-main">
    <div class="mobile-topbar">
      <button data-nav-toggle aria-label="Open navigation" aria-expanded="false" class="topbar-button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="brand" style="font-size:.88rem;"><span class="brand-mark"></span>MODULOGICAL</div>
    </div>

    <div class="thread-scroll" id="thread-scroll">
      <div class="thread-inner" id="thread-inner">
        <div class="thread-empty" id="thread-empty">
          <h2 class="h2" id="greeting">Ask Modulogical anything</h2>
          <p class="small" style="max-width:360px;">Auto mode picks the right model for what you ask. You can choose one yourself from the composer below.</p>
        </div>
      </div>
    </div>

    <div class="composer-wrap">
      <div class="composer">
        <div class="composer-box" id="composer-box">
          <textarea id="message" placeholder="Message Modulogical…" rows="1" aria-label="Message Modulogical"></textarea>
          <div class="composer-toolbar">
            <div style="position:relative;">
              <button class="control-pill chat-preference-button" id="model-pill" aria-haspopup="true" aria-expanded="false">
                <span class="dot"></span>
                <span id="model-pill-label">Auto</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
              </button>
              <div class="popover" id="model-popover" role="listbox"></div>
            </div>

            <div style="position:relative;">
              <button class="control-pill chat-preference-button" id="temp-pill" aria-haspopup="true" aria-expanded="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v13M9 8h6"/><circle cx="12" cy="18" r="3"/></svg>
                <span id="temp-pill-label">0.2</span>
              </button>
              <div class="popover temp-popover" id="temp-popover">
                <div class="temp-popover-row"><span>Temperature</span><b id="temp-value">0.2</b></div>
                <input type="range" id="temperature" min="0" max="1" step="0.01" value="0.2">
                <div class="temp-scale"><span>Precise</span><span>Creative</span></div>
              </div>
            </div>

            <span class="composer-spacer"></span>
            <button class="send-btn chat-button" id="send-btn" aria-label="Send message" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </div>
        </div>
        <div class="composer-hint">
          <span class="tiny" id="model-actual-hint">Auto — automatically selecting the best model</span>
        </div>
      </div>
    </div>
      </div>
  </div>
</div>

<script src="/assets/js/modulogical.js"></script>
<script>
(async function initChat(){
  const token = await Modulogical.requireAuth();
  Modulogical.initNav("chat");

  const displayName = localStorage.getItem(Modulogical.NAME_KEY) || localStorage.getItem(Modulogical.USERNAME_KEY) || "Account";
  document.getElementById("nav-name").textContent = displayName;
  document.getElementById("nav-avatar").textContent = Modulogical.initials(displayName);

  const threadInner = document.getElementById("thread-inner");
  const threadScroll = document.getElementById("thread-scroll");
  const threadEmpty = document.getElementById("thread-empty");
  const messageEl = document.getElementById("message");
  const sendBtn = document.getElementById("send-btn");
  const composerBox = document.getElementById("composer-box");
  const greetingEl = document.getElementById("greeting");

  let busy = false;

  function scrollToBottom(){ threadScroll.scrollTop = threadScroll.scrollHeight; }
  function hideEmptyState(){ if (threadEmpty) threadEmpty.style.display = "none"; }

  function setGreeting(){
    const hour = new Date().getHours();
    const part = hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
    const first = displayName && displayName !== "Account" ? displayName.trim().split(/\s+/)[0] : "";
    if (greetingEl) greetingEl.textContent = first ? part + ", " + first : part;
  }
  setGreeting();

  function copyText(text){
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    return new Promise((resolve, reject) => {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy") ? resolve() : reject(); } catch (e) { reject(e); }
      ta.remove();
    });
  }

  function createActionButton(label, handler){
    const button = document.createElement("button");
    button.type = "button";
    button.className = "control-pill";
    button.textContent = label;
    button.addEventListener("click", handler);
    return button;
  }

  function buildActions(msg){
    const bar = document.createElement("div");
    bar.style.display = "flex";
    bar.style.flexWrap = "wrap";
    bar.style.alignItems = "center";
    bar.style.gap = "8px";
    bar.style.marginTop = "12px";

    const copyButton = createActionButton("Copy", async () => {
      if (busy || !msg.text) return;
      try {
        await copyText(msg.text);
        copyButton.textContent = "Copied";
        setTimeout(() => copyButton.textContent = "Copy", 1500);
      } catch (e) {
        copyButton.textContent = "Press Ctrl+C";
        setTimeout(() => copyButton.textContent = "Copy", 1500);
      }
    });

    const contextButton = createActionButton("More context", () => {
      if (busy || !msg.text) return;
      const ref = msg.text.replace(/\s+/g, " ").slice(0, 140);
      chat({
        show: "More context",
        send: 'Give me more context on your earlier answer that began: "' + ref + '". Explain the background, the assumptions behind it, and anything I should know before relying on it.',
        topic: msg.topic
      });
    });

    const researchButton = createActionButton("Deep research", () => {
      if (busy || !msg.text) return;

      const subject = msg.topic || msg.text.replace(/\s+/g, " ").slice(0, 200);

      chat({
        show: "Deep research",
        send: "Do deep research on this and give me a thorough, well-structured answer with the main findings, where sources disagree, and what is still unknown: " + subject,
        topic: subject
      });
    });

    bar.appendChild(copyButton);
    bar.appendChild(contextButton);
    bar.appendChild(researchButton);
    return bar;
  }

  function addUserMessage(text){
    hideEmptyState();
    const wrap = document.createElement("div");
    wrap.className = "msg msg-user";
    wrap.innerHTML = '<div class="msg-bubble"></div>';
    wrap.querySelector(".msg-bubble").textContent = text;
    threadInner.appendChild(wrap);
    scrollToBottom();
  }

  function addAssistantMessage(){
    hideEmptyState();
    const wrap = document.createElement("div");
    wrap.className = "msg msg-assistant";
    wrap.innerHTML = `
    <div class="msg-bubble">
      <div class="msg-meta"><span class="brand-mark"></span><span>Modulogical</span><span class="model-tag"></span></div>
      <div class="msg-text markdown-body"><span class="caret"></span></div>
    </div>`;
    threadInner.appendChild(wrap);

    const msg = {
      text: "",
      topic: "",
      textEl: wrap.querySelector(".msg-text"),
      tagEl: wrap.querySelector(".model-tag")
    };
    msg.actions = buildActions(msg);
    msg.actions.style.display = "none";
    wrap.querySelector(".msg-bubble").appendChild(msg.actions);
    scrollToBottom();
    return msg;
  }

  function addStaticAssistantMessage(text, topic){
    const msg = addAssistantMessage(topic);
    msg.text = text;
    msg.textEl.innerHTML = DOMPurify.sanitize(marked.parse(text || ""));
    msg.actions.style.display = "flex";
    return msg;
  }

  async function loadContext(){
    try {
      const res = await fetch(Modulogical.API + "/context?token=" + encodeURIComponent(token), { headers: Modulogical.headers(false) });
      const result = await res.json();
      if (!result.valid) { Modulogical.clearSession(); Modulogical.goToEntry(); return; }
      if (result.messages && result.messages.length > 0) {
        let lastUserMessage = "";

        for (const m of result.messages) {
          const role = (m.role || "").toLowerCase();

          if (role.includes("you") || role.includes("user")) {
            lastUserMessage = m.content;
            addUserMessage(m.content);
          } else {
            addStaticAssistantMessage(m.content, lastUserMessage);
          }
        }

        scrollToBottom();
      }
    } catch (e) { console.error("Could not load context:", e); }
  }
  loadContext();

  const newChatBtn = document.getElementById("new-chat-btn");
  if (newChatBtn) {
    newChatBtn.addEventListener("click", () => {
      threadInner.querySelectorAll(".msg").forEach(el => el.remove());
      if (threadEmpty) { setGreeting(); threadEmpty.style.display = "flex"; }
      messageEl.value = "";
      messageEl.style.height = "auto";
      updateSendState();
      messageEl.focus();
    });
  }

  function updateSendState(){ sendBtn.disabled = busy || messageEl.value.trim().length === 0; }
  messageEl.addEventListener("input", () => {
    messageEl.style.height = "auto";
    messageEl.style.height = Math.min(messageEl.scrollHeight, 200) + "px";
    updateSendState();
  });
  messageEl.addEventListener("focus", () => composerBox.classList.add("is-focused"));
  messageEl.addEventListener("blur", () => composerBox.classList.remove("is-focused"));
  messageEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (!sendBtn.disabled) chat(); }
  });
  sendBtn.addEventListener("click", () => chat());

  const slider = document.getElementById("temperature");
  const tempValue = document.getElementById("temp-value");
  const tempPillLabel = document.getElementById("temp-pill-label");
  slider.addEventListener("input", function(){ tempValue.textContent = this.value; tempPillLabel.textContent = this.value; });

  const modelPill = document.getElementById("model-pill");
  const modelPopover = document.getElementById("model-popover");
  const modelPillLabel = document.getElementById("model-pill-label");
  const modelActualHint = document.getElementById("model-actual-hint");

  function renderModelPopover(){
    const current = Modulogical.getModelKey();
    modelPopover.innerHTML = Modulogical.MODELS.map(m => `
      <div class="model-option${m.key === current ? " selected" : ""}" data-key="${m.key}" role="option">
        <span class="dot"></span><div><div class="name">${m.label}</div><div class="desc">${m.blurb}</div></div>
      </div>`).join("");
    modelPopover.querySelectorAll(".model-option").forEach(opt => opt.addEventListener("click", () => {
      Modulogical.setModelKey(opt.getAttribute("data-key")); applySelectedModel(); closePopovers();
    }));
  }

  function applySelectedModel(){
    const model = Modulogical.modelByKey(Modulogical.getModelKey()) || Modulogical.modelByKey("auto");
    modelPillLabel.textContent = model.label;
    modelActualHint.textContent = model.key === "auto" ? "Auto — automatically selecting the best model" : model.label + " — " + model.description;
  }

  const tempPill = document.getElementById("temp-pill");
  const tempPopover = document.getElementById("temp-popover");
  function closePopovers(){
    modelPopover.classList.remove("open"); tempPopover.classList.remove("open");
    modelPill.setAttribute("aria-expanded", "false"); tempPill.setAttribute("aria-expanded", "false");
  }
  modelPill.addEventListener("click", e => {
    e.stopPropagation(); const willOpen = !modelPopover.classList.contains("open"); closePopovers();
    if (willOpen) { renderModelPopover(); modelPopover.classList.add("open"); modelPill.setAttribute("aria-expanded", "true"); }
  });
  tempPill.addEventListener("click", e => {
    e.stopPropagation(); const willOpen = !tempPopover.classList.contains("open"); closePopovers();
    if (willOpen) { tempPopover.classList.add("open"); tempPill.setAttribute("aria-expanded", "true"); }
  });
  tempPopover.addEventListener("click", e => e.stopPropagation());
  document.addEventListener("click", closePopovers);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closePopovers(); });
  applySelectedModel();

  async function chat(opts){
    if (busy) return;
    let shown, sent;
    if (opts) {
      shown = opts.show;
      sent = opts.send;
    } else {
      sent = messageEl.value;
      if (!sent.trim()) return;
      shown = sent;
      messageEl.value = "";
      messageEl.style.height = "auto";
    }

    busy = true;
    updateSendState();
    addUserMessage(shown);
    const msg = addAssistantMessage(opts && opts.topic ? opts.topic : sent);

    const modelKey = Modulogical.getModelKey();
    const model = (Modulogical.modelByKey(modelKey) || Modulogical.modelByKey("auto")).id;
    let response;
    try {
      response = await fetch(Modulogical.API + "/chat", {
        method: "POST",
        headers: Modulogical.headers(),
        body: JSON.stringify({ token, message: sent, model, temperature: document.getElementById("temperature").value })
      });
    } catch (err) {
      console.error(err);
      msg.text = "Couldn't reach Modulogical. Check your connection and try again.";
      msg.textEl.innerHTML = DOMPurify.sanitize(marked.parse(msg.text));
      busy = false; updateSendState(); return;
    }

    const usedModelId = response.headers.get("X-Atlas-Model");
    if (usedModelId) {
      const used = Modulogical.modelById(usedModelId);
      msg.tagEl.textContent = used ? "· " + used.label : "";
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let output = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      output += decoder.decode(value, { stream: true });
      msg.textEl.innerHTML = DOMPurify.sanitize(marked.parse(output));
      scrollToBottom();
    }
    output += decoder.decode();
    msg.text = output;
    msg.textEl.innerHTML = DOMPurify.sanitize(marked.parse(output));
    if (!output.trim()) {
      msg.text = "Modulogical didn't return a reply. Try sending it again.";
      msg.textEl.innerHTML = DOMPurify.sanitize(marked.parse(msg.text));
    }
    msg.actions.style.display = "flex";
    scrollToBottom();
    busy = false;
    updateSendState();
  }
})();
</script>
</body>
</html>
