<!DOCTYPE html>
<html lang="en"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f4f4f4;
            justify-content: center;
            gap: 30px;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            height: auto;
            display: flexbox;
            flex-direction: column;
            align-items: center;
        }

        input, button {
            width: 99%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 12px;
            font-size: 16px;
        }

        button {
            cursor: pointer;
        }

        #message {
            min-height: 50px;
            min-width: 100%;
            resize: vertical;
        }

         #status {
            white-space: pre-wrap;
        }
        .nav-button {
           display: inline-block;
           padding: 12px 20px;
           margin: 5px;
           background: #ddd;
           color: black;
           text-decoration: none;
           border: 1px solid #888;
           border-radius: 4px;
        }

        .nav-button:hover {
           background: #ccc;
        }

        .model-button {
            max-width: fit-content;
            font-size: 10px;
        }
    </style>
</head>
<body>
    <a href="/modules" class="nav-button">Modules</a>
    <div class="box">
        <h2>Chat</h2>
        <h2> </h2>
        <textarea id="message" placeholder="Message"></textarea> 
        <label for="temperature">
    Temperature: <span id="temperatureValue">0.2</span>
</label>

<input
    type="range"
    id="temperature"
    min="0"
    max="1"
    step="0.01"
    value="0.2"
>
        <button class="model-button" onclick="efficient()">Efficient</button>
        <button onclick="chat()">Send</button>
        <p id="messages"><b>Default Reasoning:</b> Efficient</p>
    </div>
    <script>
        const API = window.location.protocol === "file:" 
    ? "http://localhost:81" 
    : "https://unlaced-spruce-husked.ngrok-free.dev";
    
        async function efficient() {
            const model = localStorage.setItem('model', 'YCaXXcxd9qg_TbaC0WXHpbMsBMgwZOaIX9pIjeP-W-E');
           document.getElementById("messages").innerHTML = 
            `<p><b>Selected Reasoning:</b> Efficient</p>`;
        }
        async function chat() {

          const message = document.getElementById("message").value;
          const token = localStorage.getItem("atlas_token");
          const response = await fetch(API + "/chat",
         {
            method: "POST",

            headers: {
                "Content-Type": "application/json",
                "ngrok-skip-browser-warning": "69420"
            },

            body: JSON.stringify({
                token: token,
                message: message,
                model: 'YCaXXcxd9qg_TbaC0WXHpbMsBMgwZOaIX9pIjeP-W-E',
                temperature: document.getElementById("temperatureValue").textContent
            })
        }
    );

            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            let output = "";

            const model = response.headers.get("X-Atlas-Model");

            document.getElementById("messages").innerHTML =
            `<p><b>Atlas is typing</b> <span id="streaming-response"></span>...</p>`;


            const outputElement =
            document.getElementById("streaming-response");

            while (true) {
                const { value, done } = await reader.read();

                if (done) break;

                const chunk = decoder.decode(value, { stream: true });

                output += chunk;

                outputElement.textContent = output;
            }

            outputElement.textContent += decoder.decode();
            document.getElementById("messages").innerHTML = 
             `<p><b>Atlas</b> ${document.getElementById("streaming-response").textContent} </p>`;
}
    </script>


</body>
