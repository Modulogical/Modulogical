<!DOCTYPE html>
<html lang="en"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>landing</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f4f4f4;
            justify-content: center;
            gap: 30px;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            height: auto;
            display: flexbox;
            flex-direction: column;
            align-items: center;
        }

        input, button {
            width: 99%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 12px;
            font-size: 16px;
        }

        button {
            cursor: pointer;
        }

        #message {
            min-height: 50px;
            min-width: 100%;
            resize: vertical;
        }

         #status {
            white-space: pre-wrap;
        }
        .nav-button {
           display: inline-block;
           padding: 12px 20px;
           margin: 5px;
           background: #ddd;
           color: black;
           text-decoration: none;
           border: 1px solid #888;
           border-radius: 4px;
        }

        .nav-button:hover {
           background: #ccc;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Login</h1>
        <p id="loginStatus">For Returning Users</p>
        <input id="loginUsername" type="text" placeholder="Username">
        <input id="loginPassword" type="password" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>

    <div class="box">
        <h2>Register</h2>
        <p id="registerStatus">For New Users</p>
        <input id="registerName" type="text" placeholder="Name">
        <input id="registerUsername" type="text" placeholder="Username">
        <input id="registerPassword" type="password" placeholder="Password">
        <button onclick="register()">Register</button>
    </div>
    <script>
        const API = window.location.protocol === "file:" 
    ? "http://localhost:81" 
    : "https://unlaced-spruce-husked.ngrok-free.dev/";



    async function login() {
            const username = document.getElementById("loginUsername").value;
            const password = document.getElementById("loginPassword").value;

            const response = await fetch(API + "/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "ngrok-skip-browser-warning": "69420"
                },
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            });

            const result = await response.json();
            if (result.token) {
    localStorage.setItem("atlas_token", result.token);
    window.location.href = "C:/Users/alfie/Atlas/frontend_personal/chat.html";
} else {
    document.getElementById("loginStatus").textContent = result.message;
}
        }

    async function register() {
            const username = document.getElementById("registerUsername").value;
            const password = document.getElementById("registerPassword").value;
            const name = document.getElementById("registerName").value;

            const response = await fetch(API + "/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "ngrok-skip-browser-warning": "69420"
                },
                body: JSON.stringify({
                    username: username,
                    password: password,
                    name: name
                })
            });

            const result = await response.json();
            if (result.token) {
    localStorage.setItem("atlas_token", result.token);
    window.location.href = "C:/Users/alfie/Atlas/frontend_personal/chat.html";
} else {
    document.getElementById("loginStatus").textContent = result.message;
}
            
        }
        const token = localStorage.getItem("atlas_token");

if (token) {
    window.location.href = "C:/Users/alfie/Atlas/frontend_personal/chat.html";
}
    </script>
</body>




</html>
