
name: Build Inference Node

on:
  workflow_dispatch:
  push:
    paths:
      - "Inference-Node-App/src/**"
      - ".github/workflows/build-inference-node.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi requests psutil uvicorn pydantic pyinstaller

      - name: Build executable
        working-directory: Inference-Node-App/src
        run: |
            python -m PyInstaller --clean --noconfirm --onefile --name InferenceNode main.py

      - name: Commit executable to repository
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "Build updated InferenceNode.exe"
          file_pattern: "releases/InferenceNode.exe"

      - name: Upload executable
        uses: actions/upload-artifact@v6
        with:
          name: InferenceNode-Windows
          path: Inference-Node-App/src/dist/InferenceNode.exe
          if-no-files-found: error
          retention-days: 14
