name: Build and Commit Inference Node

on:
  workflow_dispatch:
  push:
    paths:
      - "Inference-Node-App/**"
      - ".github/workflows/build-inference-node.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "Inference-Node-App/requirements.txt"

      - name: Install dependencies
        working-directory: Inference-Node-App
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build desktop executable
        working-directory: Inference-Node-App
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name ModuNode --add-data "src\ui;ui" src\main.py

      - name: Copy executable to releases
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path releases | Out-Null
          Copy-Item "Inference-Node-App/dist/ModuNode.exe" "releases/ModuNode.exe" -Force

      - name: Commit executable to repository
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "ModuNode"
          file_pattern: "releases/ModuNode.exe"
