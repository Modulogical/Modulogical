
name: Build and Commit Inference Node

on:
  workflow_dispatch:
  push:
    paths:
      - "Inference-Node-App/src/**"
      - ".github/workflows/build-inference-node.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi requests psutil uvicorn pydantic rich pyinstaller

      - name: Build executable
        working-directory: Inference-Node-App/src
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --name InferenceNode main.py

      - name: Copy executable to releases
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path releases | Out-Null
          Copy-Item "Inference-Node-App/src/dist/InferenceNode.exe" "releases/InferenceNode.exe" -Force

      - name: Commit executable to repository
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "Build updated InferenceNode.exe"
          file_pattern: "releases/InferenceNode.exe"
