<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>modules</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f4f4f4;
            justify-content: center;
            gap: 30px;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            height: auto;
            display: flexbox;
            flex-direction: column;
            align-items: center;
        }

        input, button {
            width: 99%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 12px;
            font-size: 16px;
        }

        button {
            cursor: pointer;
        }

        #message {
            min-height: 50px;
            min-width: 100%;
            resize: vertical;
        }

         #status {
            white-space: pre-wrap;
        }
        .nav-button {
           display: inline-block;
           padding: 12px 20px;
           margin: 5px;
           background: #ddd;
           color: black;
           text-decoration: none;
           border: 1px solid #888;
           border-radius: 4px;
        }

        .nav-button:hover {
           background: #ccc;
        }

        .model-button {
            max-width: fit-content;
            font-size: 10px;
        }
        .context-box {
            height: 300px;
            overflow-y: auto;
        }

        .context-message {
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ddd;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .context-message strong {
            display: block;
            margin-bottom: 3px;
        }
    </style>
</head>




</html>
